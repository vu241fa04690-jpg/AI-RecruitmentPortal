services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: ai-recruitment-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGODB_URL
        value: mongodb+srv://sumii:LTd2Q48npOp6kUYF@cluster0.ycykqkj.mongodb.net/?retryWrites=true&w=majority
      - key: DATABASE_NAME
        value: ai_recruitment
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: "*"

  # 2. React + Vite Frontend Static Site
  - type: web
    name: ai-recruitment-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-recruitmentportal-backend.onrender.com
